[project]
name = "holdem-coach"
version = "0.1.0"
description = "Texas Hold'em engine, bots and a beginner coach, served over a small API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
